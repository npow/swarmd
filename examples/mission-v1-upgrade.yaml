mission: |
  Upgrade swarm from v0.2 to v1. Implement three LLM-backed specialists
  (goal_drift_critic, progress_auditor, anticheat_critic_panel),
  replace the coordinator's hardcoded severity/intervention logic with the
  intervention_judge that calls them, and add a recovery rotation that
  actually spawns a fresh claude subprocess when strikes reach 3. All
  existing tests must continue to pass; new tests must cover the new
  components. Ruff must stay clean.

workspace: "/Users/npow/code/research"

success_criteria:
  - id: tests_pass
    description: "All swarm tests pass"
    check: "PYTHONPATH=. python3 -m pytest swarm/tests/ -q"
    timeout_sec: 120
    idempotent: true

  - id: ruff_clean
    description: "Ruff finds no issues"
    check: "ruff check swarm/ --select E,F,W,I --ignore E501"
    timeout_sec: 30
    idempotent: true

  - id: goal_drift_critic_exists
    description: "goal_drift_critic module exists and exports `judge`"
    check: "PYTHONPATH=. python3 -c 'from swarm.specialists.goal_drift_critic import judge; assert callable(judge)'"
    timeout_sec: 10
    idempotent: true

  - id: progress_auditor_exists
    description: "progress_auditor module exists and exports `audit`"
    check: "PYTHONPATH=. python3 -c 'from swarm.specialists.progress_auditor import audit; assert callable(audit)'"
    timeout_sec: 10
    idempotent: true

  - id: anticheat_critic_panel_exists
    description: "anticheat_critic_panel module exists and exports `run_panel`"
    check: "PYTHONPATH=. python3 -c 'from swarm.specialists.anticheat_critic_panel import run_panel; assert callable(run_panel)'"
    timeout_sec: 10
    idempotent: true

  - id: intervention_judge_exists
    description: "intervention_judge module exists"
    check: "PYTHONPATH=. python3 -c 'from swarm.specialists.intervention_judge import decide; assert callable(decide)'"
    timeout_sec: 10
    idempotent: true

  - id: recovery_spawn_implemented
    description: "recovery_spawn module can spawn a claude subprocess"
    check: "PYTHONPATH=. python3 -c 'from swarm.specialists.recovery_spawn import spawn_recovery; assert callable(spawn_recovery)'"
    timeout_sec: 10
    idempotent: true

  - id: test_coverage_new_specialists
    description: "New specialist test files exist"
    check: |
      test -f swarm/tests/test_goal_drift_critic.py &&
      test -f swarm/tests/test_progress_auditor.py &&
      test -f swarm/tests/test_anticheat_critic_panel.py &&
      test -f swarm/tests/test_intervention_judge.py &&
      test -f swarm/tests/test_recovery_spawn.py
    timeout_sec: 10
    idempotent: true

verification:
  run_every_sec: 30
  hold_window_sec: 60
  # Let the verifier find pytest/ruff installed in the user's active Python
  # environment (conda / venv / ~/.local/bin)
  path_add:
    - "/Users/npow/anaconda3/envs/py310/bin"
    - "/Users/npow/.local/bin"
  env_passthrough:
    - PYTHONPATH
    - HOME

invariants:
  test_count_floor: 100   # v0.2 had 103 tests; cannot drop below 100 (protects against test deletion)
  no_mock:
    - swarm/tests/test_hook_detector_contract.py   # integration tests must not mock their way green

concurrency:
  max_total_live: 8
  max_depth: 4
  max_fan_out_per_parent: 3

observer_config:
  plan_checkpoint_every_sec: 300
  goal_drift_cadence_sec: 120
  progress_audit_cadence_sec: 120

anticheat:
  primary: "claude -p --bare --model opus"
