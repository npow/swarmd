mission: |
  Implement a FizzBuzz function at app/fizzbuzz.py. Given an integer n, return
  "Fizz" if n is divisible by 3, "Buzz" if divisible by 5, "FizzBuzz" if
  divisible by both, otherwise the string representation of n. Add tests at
  app/tests/test_fizzbuzz.py.

workspace: "/Users/npow/code/research/swarm/examples/workspace"

success_criteria:
  - id: tests_pass
    description: "All tests in app/tests/ pass"
    check: "python3 -m pytest app/tests/ -x -q"
    timeout_sec: 60
    idempotent: true

  - id: function_contract
    description: "The function behaves correctly on canonical inputs"
    check: "python3 ../checks/verify_function.py"
    timeout_sec: 30
    idempotent: true

  - id: no_todo_stubs
    description: "No TODO or pass-only stub left in fizzbuzz.py"
    check: "! grep -E '^\\s*(TODO|pass\\s*$)' app/fizzbuzz.py"
    timeout_sec: 10
    idempotent: true

verification:
  run_every_sec: 20
  hold_window_sec: 40

invariants:
  test_count_floor: 3
  no_mock:
    - app/tests/

concurrency:
  max_total_live: 4
  max_depth: 2
  max_fan_out_per_parent: 2

observer_config:
  plan_checkpoint_every_sec: 120
  goal_drift_cadence_sec: 60
  progress_audit_cadence_sec: 60

anticheat:
  primary: "claude -p --bare --model opus"
