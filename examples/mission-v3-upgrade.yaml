mission: |
  Upgrade swarm v2 → v3. Integrate the specialists that exist but aren't
  actually called:
  1. Launcher starts all 5 daemons (add supervisor, llm_loop, spawner).
  2. Coordinator invokes anticheat_critic_panel on pass-transitions —
     not just on mission_complete retrospective.
  3. Add `swarm-spawn` CLI wrapper so agents can request subagent spawns.
  4. Tighten deny patterns: keep absolute-path denies; remove over-broad
     catch-alls that block legitimate commands outside swarm paths.
  5. Write cycle metrics into swarm/metrics.json automatically via
     swarm/scripts/update_metrics.py.

workspace: "/Users/npow/code/research"

success_criteria:
  - id: tests_pass
    description: "All tests pass"
    check: "PYTHONPATH=. python3 -m pytest swarm/tests/ -q"
    timeout_sec: 120
    idempotent: true

  - id: ruff_clean
    description: "Ruff clean"
    check: "ruff check swarm/ --select E,F,W,I --ignore E501"
    timeout_sec: 30
    idempotent: true

  - id: launcher_starts_all_daemons
    description: "launch.sh lists all 5 daemons"
    check: |
      grep -q 'supervisor' swarm/launch.sh &&
      grep -q 'llm_loop' swarm/launch.sh &&
      grep -q 'spawner' swarm/launch.sh &&
      grep -q 'pattern_detector' swarm/launch.sh &&
      grep -q 'success_verifier' swarm/launch.sh &&
      grep -q 'coordinator' swarm/launch.sh
    timeout_sec: 10
    idempotent: true

  - id: coordinator_invokes_anticheat
    description: "coordinator routes pass-transitions through anticheat_critic_panel"
    check: |
      grep -q 'anticheat_critic_panel' swarm/specialists/coordinator.py &&
      grep -q 'pass_transition' swarm/specialists/coordinator.py
    timeout_sec: 10
    idempotent: true

  - id: swarm_spawn_cli_exists
    description: "swarm-spawn CLI is executable"
    check: "test -x swarm/swarm-spawn"
    timeout_sec: 5
    idempotent: true

  - id: swarm_spawn_validates_input
    description: "swarm-spawn rejects depth over max"
    check: |
      out=$(SESSION_ID=abcdef012345 PYTHONPATH=. python3 swarm/swarm-spawn --parent test --depth 999 --mission x --max-depth 3 2>&1 || true)
      echo "$out" | grep -q 'reject'
    timeout_sec: 10
    idempotent: true

  - id: metrics_updater_exists
    description: "update_metrics.py exists"
    check: "test -f swarm/scripts/update_metrics.py"
    timeout_sec: 5
    idempotent: true

  - id: metrics_contains_v2
    description: "metrics.json has v2 cycle entry"
    check: "PYTHONPATH=. python3 -c 'import json; d=json.load(open(\"swarm/metrics.json\")); assert any(c[\"version\"].startswith(\"v2\") for c in d[\"cycles\"])'"
    timeout_sec: 5
    idempotent: true

  - id: anticheat_integration_test
    description: "integration test for coordinator→anticheat wiring"
    check: "PYTHONPATH=. python3 -m pytest swarm/tests/test_coordinator_anticheat.py -q"
    timeout_sec: 30
    idempotent: true

  - id: swarm_spawn_tests
    description: "tests for swarm-spawn CLI"
    check: "PYTHONPATH=. python3 -m pytest swarm/tests/test_swarm_spawn_cli.py -q"
    timeout_sec: 30
    idempotent: true

  - id: test_count_grew
    description: "Test count ≥ 210 (v2 had 195)"
    check: |
      count=$(PYTHONPATH=. python3 -m pytest swarm/tests/ --collect-only -q 2>&1 | grep -E "[0-9]+ tests? collected" | grep -oE "^[0-9]+")
      test -n "$count" && test "$count" -ge 210
    timeout_sec: 60
    idempotent: true

verification:
  run_every_sec: 30
  hold_window_sec: 60
  path_add:
    - "/Users/npow/anaconda3/envs/py310/bin"
    - "/Users/npow/.local/bin"
  env_passthrough:
    - PYTHONPATH
    - HOME

invariants:
  test_count_floor: 195

concurrency:
  max_total_live: 8
  max_depth: 4
  max_fan_out_per_parent: 3

observer_config:
  plan_checkpoint_every_sec: 300

anticheat:
  primary: "claude -p --bare --model opus"
