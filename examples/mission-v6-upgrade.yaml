mission: |
  Upgrade swarm v5 → v6. System-resource robustness:
  1. resource_monitor daemon: tracks FD count, zombie count, memory,
     CPU, process-tree size, and emits meta findings when thresholds are
     breached (warning + critical levels).
  2. Zombie reaper in spawner — periodically waitpid(-1, WNOHANG) to reap
     any zombie children, mark their tree.json entries dead.
  3. Launcher sets ulimit -n 65536 at start so daemons don't hit FD limit.
  4. Launcher kills the ENTIRE process group on exit (not just the tracked
     PIDs) to prevent orphaned subagents.
  5. Leak-detector test: spawn N children, verify all are reaped.

workspace: "/Users/npow/code/research"

success_criteria:
  - id: tests_pass
    description: "All tests pass"
    check: "PYTHONPATH=. python3 -m pytest swarm/tests/ -q"
    timeout_sec: 180
    idempotent: true

  - id: ruff_clean
    description: "Ruff clean"
    check: "ruff check swarm/ --select E,F,W,I --ignore E501"
    timeout_sec: 30
    idempotent: true

  - id: mypy_clean
    description: "Mypy clean"
    check: "MYPYPATH=. python3 -m mypy --explicit-package-bases -p swarm.lib -p swarm.schemas -p swarm.specialists --ignore-missing-imports --no-strict-optional --disable-error-code=no-untyped-def --disable-error-code=var-annotated 2>&1 | tail -1 | grep -q -E 'Success|no issues'"
    timeout_sec: 60
    idempotent: true

  - id: resource_monitor_exists
    description: "resource_monitor module exists with check_resources()"
    check: "PYTHONPATH=. python3 -c 'from swarm.specialists.resource_monitor import check_resources, ResourceSnapshot; assert callable(check_resources)'"
    timeout_sec: 10
    idempotent: true

  - id: resource_monitor_reports_findings
    description: "Monitor produces findings when thresholds exceeded"
    check: "PYTHONPATH=. python3 -m pytest swarm/tests/test_resource_monitor.py -q"
    timeout_sec: 30
    idempotent: true

  - id: zombie_reaper_exists
    description: "spawner exports reap_zombies"
    check: "PYTHONPATH=. python3 -c 'from swarm.specialists.spawner import reap_zombies; assert callable(reap_zombies)'"
    timeout_sec: 10
    idempotent: true

  - id: launcher_sets_ulimit
    description: "Launcher sets ulimit -n"
    check: "grep -qE 'ulimit -n' swarm/launch.sh"
    timeout_sec: 5
    idempotent: true

  - id: launcher_kills_process_group
    description: "Launcher kills process group on exit"
    check: |
      grep -qE 'kill.*-\$\$|kill.*PGID|trap.*EXIT' swarm/launch.sh &&
      grep -qE '(setsid|set -m)' swarm/launch.sh
    timeout_sec: 5
    idempotent: true

  - id: leak_detector_test_exists
    description: "Tests for process leak detection"
    check: "PYTHONPATH=. python3 -m pytest swarm/tests/test_leak_detection.py -q"
    timeout_sec: 30
    idempotent: true

  - id: v5_metrics_recorded
    description: "v5 metrics captured"
    check: "PYTHONPATH=. python3 -c 'import json; d=json.load(open(\"swarm/metrics.json\")); v5=[c for c in d[\"cycles\"] if c[\"version\"].startswith(\"v5\")]; assert v5 and v5[-1][\"tests_passing\"] >= 246'"
    timeout_sec: 5
    idempotent: true

  - id: test_count_above_260
    description: "Test count ≥ 260"
    check: |
      count=$(PYTHONPATH=. python3 -m pytest swarm/tests/ --collect-only -q 2>&1 | grep -E "[0-9]+ tests? collected" | grep -oE "^[0-9]+")
      test -n "$count" && test "$count" -ge 260
    timeout_sec: 60
    idempotent: true

verification:
  run_every_sec: 30
  hold_window_sec: 60
  path_add:
    - "/Users/npow/anaconda3/envs/py310/bin"
    - "/Users/npow/.local/bin"
  env_passthrough:
    - PYTHONPATH
    - HOME

invariants:
  test_count_floor: 246

concurrency:
  max_total_live: 8
  max_depth: 4
  max_fan_out_per_parent: 3

observer_config:
  plan_checkpoint_every_sec: 300

anticheat:
  primary: "claude -p --bare --model opus"
