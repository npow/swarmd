mission: |
  Upgrade swarm from v1 to v2. Goals:
  1. Wire LLM specialists into an actual daemon that runs them on cadence.
  2. Implement supervisor daemon that heartbeat-watches specialists.
  3. Implement spawner daemon with admission control + tree tracking.
  4. Add true end-to-end integration test that runs a simulated session.
  5. Fix coordinator's inline import (lazy-import smell).
  6. Document swarm usage in CLAUDE.md for future sessions.

workspace: "/Users/npow/code/research"

success_criteria:
  - id: tests_pass
    description: "All swarm tests pass"
    check: "PYTHONPATH=. python3 -m pytest swarm/tests/ -q"
    timeout_sec: 120
    idempotent: true

  - id: ruff_clean
    description: "Ruff finds no issues"
    check: "ruff check swarm/ --select E,F,W,I --ignore E501"
    timeout_sec: 30
    idempotent: true

  - id: supervisor_exists
    description: "supervisor module exports main() and check_all()"
    check: "PYTHONPATH=. python3 -c 'from swarm.specialists.supervisor import main, check_all; assert callable(main) and callable(check_all)'"
    timeout_sec: 10
    idempotent: true

  - id: spawner_exists
    description: "spawner module exports the admission controller"
    check: "PYTHONPATH=. python3 -c 'from swarm.specialists.spawner import admit_spawn, SpawnerState; assert callable(admit_spawn)'"
    timeout_sec: 10
    idempotent: true

  - id: llm_specialist_daemon_exists
    description: "A daemon wrapper actually runs goal_drift_critic + progress_auditor on cadence"
    check: "PYTHONPATH=. python3 -c 'from swarm.specialists.llm_loop import main, one_cycle; assert callable(main) and callable(one_cycle)'"
    timeout_sec: 10
    idempotent: true

  - id: integration_test_exists
    description: "True end-to-end integration test file exists"
    check: "test -f swarm/tests/test_integration_e2e.py"
    timeout_sec: 5
    idempotent: true

  - id: coordinator_no_inline_imports
    description: "Coordinator has no deferred/inline imports of intervention_judge"
    check: "! grep -n 'from swarm.specialists.intervention_judge' swarm/specialists/coordinator.py | grep -v '^[1-9][0-9]*:from swarm.specialists.intervention_judge'"
    timeout_sec: 5
    idempotent: true

  - id: claude_md_exists
    description: "CLAUDE.md for the swarm project exists"
    check: "test -f swarm/CLAUDE.md && test -s swarm/CLAUDE.md"
    timeout_sec: 5
    idempotent: true

  - id: metrics_track_exists
    description: "Progress metrics file exists and is valid JSON"
    check: "PYTHONPATH=. python3 -c 'import json; json.load(open(\"swarm/metrics.json\"))'"
    timeout_sec: 5
    idempotent: true

  - id: new_tests_exist
    description: "Tests for supervisor, spawner, llm_loop, and integration e2e all exist"
    check: |
      test -f swarm/tests/test_supervisor.py &&
      test -f swarm/tests/test_spawner.py &&
      test -f swarm/tests/test_llm_loop.py &&
      test -f swarm/tests/test_integration_e2e.py
    timeout_sec: 10
    idempotent: true

  - id: test_floor_raised
    description: "Test count at or above 180 (v1 had 164)"
    check: |
      count=$(PYTHONPATH=. python3 -m pytest swarm/tests/ --collect-only -q 2>&1 | grep -E "[0-9]+ tests? collected" | grep -oE "^[0-9]+")
      test -n "$count" && test "$count" -ge 180
    timeout_sec: 60
    idempotent: true

verification:
  run_every_sec: 30
  hold_window_sec: 60
  path_add:
    - "/Users/npow/anaconda3/envs/py310/bin"
    - "/Users/npow/.local/bin"
  env_passthrough:
    - PYTHONPATH
    - HOME

invariants:
  test_count_floor: 164   # v1 had 164; never drop below
  no_mock:
    - swarm/tests/test_hook_detector_contract.py
    - swarm/tests/test_integration_e2e.py

concurrency:
  max_total_live: 8
  max_depth: 4
  max_fan_out_per_parent: 3

observer_config:
  plan_checkpoint_every_sec: 300

anticheat:
  primary: "claude -p --bare --model opus"
