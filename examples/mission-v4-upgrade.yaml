mission: |
  Upgrade swarm v3 → v4. This cycle HARDENS existing features rather than
  adding new components. Focus:
  1. Surgical deny patterns (no more catch-all Bash(*~/.swarm/*) that
     blocks benign cd commands outside swarm paths).
  2. Spawner daemon that actually consumes the queue and launches claude
     subprocesses (not just registering intent).
  3. completion_judge requires per-criterion anticheat GENUINE_FIX verdict
     before emitting mission_complete (not just "no cheat findings exist").
  4. Real end-to-end launcher test in pytest (using stubbed claude binary).
  5. Second-opinion anticheat critic plumbed through when mission sets
     anticheat.second_opinion.
  6. No TODO/FIXME strings in production code (code-health gate).

workspace: "/Users/npow/code/research"

success_criteria:
  - id: tests_pass
    description: "All tests pass"
    check: "PYTHONPATH=. python3 -m pytest swarm/tests/ -q"
    timeout_sec: 120
    idempotent: true

  - id: ruff_clean
    description: "Ruff clean"
    check: "ruff check swarm/ --select E,F,W,I --ignore E501"
    timeout_sec: 30
    idempotent: true

  - id: deny_patterns_surgical
    description: "settings.json.template uses absolute swarm-path prefixes, not universal-match catch-alls"
    check: |
      ! grep -q 'Bash(\*~/\.swarm' swarm/settings.json.template &&
      ! grep -q 'Bash(\*/.swarm' swarm/settings.json.template
    timeout_sec: 5
    idempotent: true

  - id: spawner_daemon_exists
    description: "spawner module exports run_daemon"
    check: "PYTHONPATH=. python3 -c 'from swarm.specialists.spawner import run_daemon_once; assert callable(run_daemon_once)'"
    timeout_sec: 10
    idempotent: true

  - id: completion_requires_anticheat
    description: "completion_judge checks anticheat verdicts"
    check: |
      grep -q 'anticheat' swarm/specialists/completion_judge.py &&
      grep -q 'GENUINE_FIX\|require_anticheat' swarm/specialists/completion_judge.py
    timeout_sec: 5
    idempotent: true

  - id: second_opinion_support
    description: "anticheat_critic_panel accepts second_opinion_runner"
    check: "PYTHONPATH=. python3 -c 'from swarm.specialists.anticheat_critic_panel import run_panel; import inspect; sig=inspect.signature(run_panel); assert \"second_opinion\" in sig.parameters, sig.parameters'"
    timeout_sec: 10
    idempotent: true

  - id: launcher_e2e_test_exists
    description: "pytest integration test that invokes launch.sh with stubbed claude"
    check: "PYTHONPATH=. python3 -m pytest swarm/tests/test_launcher_integration.py -q"
    timeout_sec: 60
    idempotent: true

  - id: no_todos_in_prod
    description: "No TODO/FIXME in production code (tests may still have them)"
    check: |
      ! grep -rn 'TODO\|FIXME\|XXX' swarm/specialists/ swarm/lib/ swarm/schemas/ swarm/hooks/
    timeout_sec: 10
    idempotent: true

  - id: v3_metrics_recorded
    description: "metrics.json contains a v3 entry with correct test count"
    check: "PYTHONPATH=. python3 -c 'import json; d=json.load(open(\"swarm/metrics.json\")); v3=[c for c in d[\"cycles\"] if c[\"version\"].startswith(\"v3\")]; assert v3 and v3[-1][\"tests_passing\"] >= 200, v3'"
    timeout_sec: 5
    idempotent: true

  - id: test_count_above_225
    description: "Test count ≥ 225 (v3 had 210)"
    check: |
      count=$(PYTHONPATH=. python3 -m pytest swarm/tests/ --collect-only -q 2>&1 | grep -E "[0-9]+ tests? collected" | grep -oE "^[0-9]+")
      test -n "$count" && test "$count" -ge 225
    timeout_sec: 60
    idempotent: true

verification:
  run_every_sec: 30
  hold_window_sec: 60
  path_add:
    - "/Users/npow/anaconda3/envs/py310/bin"
    - "/Users/npow/.local/bin"
  env_passthrough:
    - PYTHONPATH
    - HOME

invariants:
  test_count_floor: 210

concurrency:
  max_total_live: 8
  max_depth: 4
  max_fan_out_per_parent: 3

observer_config:
  plan_checkpoint_every_sec: 300

anticheat:
  primary: "claude -p --bare --model opus"
