[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm"
version = "0.1.0"
description = "Durable multi-agent orchestrator built on Temporal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nissan Pow" }]
dependencies = [
    "temporalio>=1.6.0",
    "anthropic>=0.40.0",
    "pydantic>=2.5.0",
    "click>=8.1.0",
    "mcp>=0.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
swarm = "swarm.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm*"]
exclude = ["tests*", "lib*", "hooks*", "specialists*", "schemas*", "scripts*", "templates*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".."]
addopts = "--import-mode=importlib"
